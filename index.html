<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' https://unpkg.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Terra Nova</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Project Terra Nova</h1>
            <div id="wallet-status">
                </div>
        </header>

        <main>
            <div id="clicker-section">
                <p class="income-display"><span id="pazcoin-per-second">0.00</span> $XPAZ por segundo</p>

                <div id="globe-container">
                    <img src="globe.png" id="globe" alt="Planeta Tierra Clickeable">
                    <div id="click-feedback">+1</div>
                </div>

                <h2 class="balance-display"><span id="pazcoin-balance">0</span> $XPAZ</h2>
            </div>

            <div id="projects-section">
                <h2>Proyectos Globales</h2>
                <div id="projects-list">
                    </div>
            </div>
        </main>

        <footer>
            <p>Project Terra Nova - Un Juego Incremental de Paz Global</p>
        </footer>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
